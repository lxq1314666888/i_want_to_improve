name: AI news checks
on:
  pull_request:
    paths: ['projects/ai-news-briefing/**', '.github/workflows/ai-news-*.yml']
  push:
    branches: [main]
    paths: ['projects/ai-news-briefing/**', '.github/workflows/ai-news-*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/ai-news-briefing
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/ai-news-briefing/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run build
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'

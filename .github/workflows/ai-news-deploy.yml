name: Deploy AI news
on:
  workflow_dispatch:
    inputs:
      resource_name:
        description: 'Dedicated Worker and D1 name; do not reuse an unrelated service'
        required: true
        default: workbuddy-ai-news
        type: string
      allow_update:
        description: 'Allow updating existing resources owned by THIS project'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ai-news-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/ai-news-briefing
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/ai-news-briefing/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Prepare dedicated Cloudflare resources
        id: prepare
        run: node scripts/prepare-deploy.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          RESOURCE_NAME: ${{ inputs.resource_name }}
          ALLOW_REUSE: ${{ inputs.allow_update }}
      - name: Apply migration and deploy
        run: |
          npm run db:remote
          npm run deploy
          node -e 'process.stdout.write(JSON.stringify({READ_TOKEN:process.env.READ_TOKEN,INGEST_TOKEN:process.env.INGEST_TOKEN}))' | npx wrangler secret bulk
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      - name: Verify deployed API and MCP
        run: node scripts/smoke.mjs
        env:
          API_BASE_URL: ${{ steps.prepare.outputs.api_base_url }}
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
      - name: Publish deployment instructions
        run: node scripts/deploy-summary.mjs
        env:
          API_BASE_URL: ${{ steps.prepare.outputs.api_base_url }}
      - name: Initial collection
        run: python scripts/collect.py
        env:
          API_BASE_URL: ${{ steps.prepare.outputs.api_base_url }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}

name: Deploy AI news

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resource_name:
        description: "Cloudflare 资源名（Worker 与 D1 同名）"
        required: false
        default: workbuddy-ai-news
      allow_update:
        description: "同名资源已存在时，确认属于本项目后勾选以允许覆盖"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-ai-news-deploy
    env:
      # Account ID 兼容 Secrets 或 Variables 两种存放方式
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Configure resource name
        id: cfg
        run: |
          RESOURCE="${{ github.event.inputs.resource_name || 'workbuddy-ai-news' }}"
          echo "resource=$RESOURCE" >> "$GITHUB_OUTPUT"
          sed -i "s/^name = .*/name = \"$RESOURCE\"/" wrangler.toml
          sed -i "s/^database_name = .*/database_name = \"$RESOURCE\"/" wrangler.toml
          cat wrangler.toml

      - name: Create or reuse D1 database
        id: d1
        run: |
          RESOURCE="${{ steps.cfg.outputs.resource }}"
          OUT=$(wrangler d1 create "$RESOURCE" 2>&1 || true)
          echo "$OUT"
          if echo "$OUT" | grep -qi "already exists"; then
            if [ "${{ github.event.inputs.allow_update }}" != "true" ]; then
              echo "::error::同名 D1 数据库 '$RESOURCE' 已存在。确认它属于本项目后再勾选 allow_update 重试；不属于本项目请换一个未使用的 resource_name。"
              exit 1
            fi
            echo "复用已存在的数据库 $RESOURCE"
          fi
          # 解析 database_id：优先从 create 输出，其次从 d1 list 查询
          DB_ID=$(echo "$OUT" | grep -oE "with id '[^']+'" | head -1 | sed "s/with id '//;s/'//")
          if [ -z "$DB_ID" ]; then
            wrangler d1 list --json > /tmp/d1.json || true
            DB_ID=$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const r=(a||[]).find(x=>x.name==='$RESOURCE');console.log(r?r.uuid:'')")
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::无法解析 D1 数据库 ID，请检查 CLOUDFLARE_API_TOKEN 权限（需要 Account > D1 > Edit）"
            exit 1
          fi
          sed -i "s/^database_id = .*/database_id = \"$DB_ID\"/" wrangler.toml
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "database_id 已写入 wrangler.toml"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 schema
        run: wrangler d1 execute "${{ steps.cfg.outputs.resource }}" --remote --file=schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        id: deploy
        run: |
          OUT=$(wrangler deploy 2>&1 | tee /tmp/deploy.log)
          echo "$OUT"
          URL=$(grep -oE 'https://[a-z0-9-]+\.workers\.dev' /tmp/deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::无法从部署输出解析 workers.dev 地址，请检查 CLOUDFLARE_ACCOUNT_ID 与子域名配置"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Write Worker secrets
        run: |
          echo "${{ secrets.READ_TOKEN }}" | wrangler secret put READ_TOKEN --name "${{ steps.cfg.outputs.resource }}"
          echo "${{ secrets.INGEST_TOKEN }}" | wrangler secret put INGEST_TOKEN --name "${{ steps.cfg.outputs.resource }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify deployment
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "== GET /health =="
          curl -sS "$URL/health"; echo
          echo "== GET /api/news without token (expect HTTP 401) =="
          curl -sS -o /tmp/nr.txt -w "HTTP %{http_code}\n" "$URL/api/news"; cat /tmp/nr.txt; echo
          echo "== GET /mcp without token (expect HTTP 401) =="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "$URL/mcp"
          echo "== POST /mcp initialize with READ_TOKEN =="
          curl -sS -X POST "$URL/mcp" -H "Authorization: Bearer ${{ secrets.READ_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"deploy-check","version":"1"}}}' \
            | head -c 400; echo

      - name: Write deploy summary
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          {
            echo "## AI news API deployed"
            echo ""
            echo "- **API_BASE_URL**: \`$URL\`"
            echo "- **Health**: $URL/health"
            echo "- **MCP**: $URL/mcp"
            echo ""
            echo "下一步：在仓库 Variables 中设置 \`API_BASE_URL\` 为 \`$URL\`，测试通过后设置 \`AI_NEWS_ENABLED\` 为 \`true\`。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Initial collection
        run: node scripts/collect.js
        env:
          API_BASE_URL: ${{ steps.deploy.outputs.url }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          NEWS_HOURS: "24"
        continue-on-error: true

name: Apply collector config

# 改 config/*.json 或 Worker 源码后自动部署，让配置真正生效。
# 配置被编译进 Worker（src/worker.js 会 import config/*.json），所以只改仓库文件不够，
# 必须重新部署。这里把「校验 → 测试 → 注入 D1 id → 部署」串起来，失败即中止。
on:
  push:
    branches: [main]
    paths:
      - 'projects/ai-news-briefing/config/**'
      - 'projects/ai-news-briefing/src/**'
      - 'projects/ai-news-briefing/scripts/collect.py'
      - '.github/workflows/ai-news-apply-config.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-news-apply-config
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/ai-news-briefing
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/ai-news-briefing/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt

      # 配置有问题就在这里失败，并打印具体是哪一项，不拖到部署阶段
      - name: Validate configuration
        run: python scripts/validate_config.py
      - name: Build the Worker bundle
        run: npm run build
      - run: python -m unittest discover -s tests -p 'test_*.py'

      # 仓库里的 wrangler.json 保留占位 database_id，由本步骤注入真实值
      - name: Inject the D1 database id
        run: node scripts/prepare-deploy.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          RESOURCE_NAME: workbuddy-ai-news
          ALLOW_REUSE: 'true'

      # deploy 只更新代码与绑定，已配置的 Worker secrets 保持不变
      - name: Apply migration and deploy
        run: |
          npm run db:remote
          npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify the deployed API
        run: node scripts/smoke.mjs
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          READ_TOKEN: ${{ secrets.READ_TOKEN }}

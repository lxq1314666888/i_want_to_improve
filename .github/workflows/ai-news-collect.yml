name: Collect AI news
on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-news-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AI_NEWS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/ai-news-briefing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/collect.py
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
